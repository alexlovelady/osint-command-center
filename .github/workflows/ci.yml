# This workflow had NOT run on GitHub when it was written (the repository was created afterwards). Every command below was run locally on
# Windows and, for the backend, in an Ubuntu 22.04 container; see docs/progress.md for what was and was not verified.
# Every third-party action is pinned to a commit SHA (the tag it came from is in the trailing comment).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check backend tests scripts
      - run: uv run mypy
      - run: uv run pytest -q
        env:
          OSINTCC_RETRY_SCALE: "0.001"
      - run: uv run python scripts/secret_scan.py

  web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm typecheck
        working-directory: apps/web
      - run: pnpm lint
        working-directory: apps/web
      - run: pnpm test
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
      - run: pnpm audit
        working-directory: apps/web
      - run: pnpm e2e   # uses the Microsoft Edge preinstalled on windows-latest runners
        working-directory: apps/web

  desktop:
    runs-on: windows-latest
    steps:
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: pnpm install --frozen-lockfile && pnpm build   # the shell embeds the built UI at compile time
        working-directory: apps/web
      - run: New-Item -ItemType Directory -Force binaries | Out-Null; New-Item -ItemType File -Force binaries/osintcc-backend-x86_64-pc-windows-msvc.exe | Out-Null   # tauri.conf lists the sidecar as externalBin; tests do not run it
        shell: pwsh
        working-directory: apps/desktop/src-tauri
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: apps/desktop/src-tauri

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked
      - run: uv export --no-dev --no-hashes --format requirements-txt -o req.txt
      - run: uv tool run pip-audit -r req.txt --no-deps --disable-pip

  package-windows:
    needs: [backend, web, desktop]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: apps/web
      - run: uv run python scripts/build_sidecar.py
      - run: |
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/sidecar/osintcc-backend-x86_64-pc-windows-msvc.exe apps/desktop/src-tauri/binaries/
        shell: pwsh
      - run: ../web/node_modules/.bin/tauri build --bundles nsis
        working-directory: apps/desktop
      - run: uv run python scripts/sidecar_smoke.py
      - run: uv run python scripts/release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-windows-unsigned
          path: dist/release/*

  linux-package:
    needs: [backend]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 11 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: apps/web
      - run: docker build -t osintcc-linux-build docker/linux-build
      - run: mkdir -p dist/linux && docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist/linux:/out" osintcc-linux-build bash /src/docker/linux-build/build.sh
      - run: docker run --rm --cap-add NET_RAW --cap-add NET_ADMIN -v "$PWD:/src:ro" -v "$PWD/dist/linux:/out" osintcc-linux-build bash /src/docker/linux-build/egress.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-portable-unsigned
          path: dist/linux/linux/*
