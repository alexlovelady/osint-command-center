[project]
name = "osintcc"
version = "0.1.0"
description = "OSINT Command Center - local-first, lawful, evidence-grounded analysis workstation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "httpx>=0.27",
  "dnspython>=2.6",
  "idna>=3.7",
  "keyring>=25",
  "reportlab>=4.2",
  "markdown-it-py>=3.0",
  "nh3>=0.2.18",
  "pyyaml>=6",
  "numpy>=2.5.4",
  "cryptography>=50.0.2",
  "sqlcipher3-wheels>=0.5.7",
  "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=5",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/osintcc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend", "tests", "tests/fixtures"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.uv]
package = true

[tool.ruff.lint]
ignore = ["BLE001", "ISC004", "SIM102", "SIM115", "SIM117", "SIM210", "PERF102", "C408", "FURB162"]

[tool.mypy]
python_version = "3.12"
files = ["backend/osintcc"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
